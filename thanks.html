var DAY=864e5,T=14*DAY,LS={get:function(k){try{var v=JSON.parse(localStorage.getItem(k)||'null');if(v&&v.t>Date.now()-T)return v.v}catch(x){}return null},set:function(k,v){try{localStorage.setItem(k,JSON.stringify({t:Date.now(),v:v}))}catch(x){}},del:function(k){try{localStorage.removeItem(k)}catch(x){}}};
var KS='hp-preview-key:'+P.salt,PS='hp-preview-pw';
function b64(raw){return btoa(String.fromCharCode.apply(null,new Uint8Array(raw)))}
function unlock(p){return fromPw(p).then(function(raw){return open(raw).then(function(){LS.set(KS,b64(raw));LS.set(PS,p)})})}
var m=document.querySelector('main'),savedKey=LS.get(KS),savedPw=LS.get(PS);
if(savedKey||savedPw){m.style.visibility='hidden';
  (savedKey?open(u8(savedKey)).catch(function(){LS.del(KS);if(savedPw)return unlock(savedPw);throw 0}):unlock(savedPw))
  .catch(function(){LS.del(PS);m.style.visibility='';pw.focus()})}else{pw.focus()}
f.addEventListener('submit',function(ev){ev.preventDefault();e.textContent='Opening…';unlock(pw.value).catch(function(){e.textContent='That password did not work. Please try again.';pw.select()})});
